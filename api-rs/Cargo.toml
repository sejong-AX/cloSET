[package]
name = "closet-api-rs"
version = "0.1.0"
edition = "2021"
description = "cloSET Rust 백엔드 — 결정적 판정 엔진(BUY/STOP/ALTERNATIVE) + GPT-4o 설명. Vercel Rust 런타임 함수 + 로컬 axum 서버."

[lib]
path = "src/lib.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
vercel_runtime = "2"
http-body-util = "0.1"
# axum 서버(로컬 실행/타 호스팅 포팅용)는 server 피처로만 컴파일 → Vercel 함수 빌드는 가볍게 유지
axum = { version = "0.7", optional = true }

[features]
server = ["dep:axum"]

# Vercel 서버리스 함수 (api/*.rs → /api/scan, /api/care)
[[bin]]
name = "scan"
path = "api/scan.rs"

[[bin]]
name = "care"
path = "api/care.rs"

[[bin]]
name = "style"
path = "api/style.rs"

# 로컬/포터블 axum 서버 (cargo run --features server --bin server)
[[bin]]
name = "server"
path = "src/main.rs"
required-features = ["server"]

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
